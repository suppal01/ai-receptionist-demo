<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dashboard{% endblock %} · Sparkle Dental receptionist</title>
<style>
  /* A working console: one content column under a slim nav; state shown as chips and stripes. */
  :root {
    --paper: #f4f6f7; --card: #ffffff; --ink: #18232b; --muted: #5e6c77; --line: #d8dfe4; --soft: #eef2f4;
    --accent: #0d6b72; --accent-ink: #ffffff; --accent-soft: #e2f0f0;
    --good: #1f7a46; --good-soft: #e3f3e9; --bad: #b3261e; --bad-soft: #fbe7e5; --warn: #8a5a00; --warn-soft: #fbf0d9;
    --caller: #e3f0f0;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0f1519; --card: #172027; --ink: #e3eaee; --muted: #97a6b1; --line: #2a3640; --soft: #1d2830;
      --accent: #5fbfc4; --accent-ink: #0f1519; --accent-soft: #163236;
      --good: #6fcf97; --good-soft: #173826; --bad: #f2837a; --bad-soft: #3d1e1c; --warn: #e5b85c; --warn-soft: #3a2f17;
      --caller: #163236; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
  a { color: var(--accent); }
  nav { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
  nav .in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
  nav .brand { font-weight: 600; margin-right: 8px; }
  nav a { text-decoration: none; color: var(--muted); padding: 2px 0; border-bottom: 2px solid transparent; }
  nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
  nav a:hover { color: var(--ink); }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 18px; }
  h1 { font-size: 1.35rem; margin: 0; text-wrap: balance; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 0.85em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
  .tile .n { font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile a { text-decoration: none; color: inherit; }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--soft); }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip { display: inline-block; font-size: 0.75rem; padding: 1px 7px; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filters a { text-decoration: none; font-size: 0.85rem; padding: 3px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--card); }
  .filters a.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  form.inline { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0; }
  button, select, input[type=text] { font: inherit; font-size: 0.85rem; }
  button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--card); color: var(--accent); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  input[type=text] { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); min-width: 0; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .targets { display: grid; gap: 6px; }
  .target { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 0.9rem; }
  .bar { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--good); }
  .bar span.miss { background: var(--bad); }
  .bar span.track { background: var(--warn); }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<nav aria-label="Dashboard">
  <div class="in">
    <span class="brand">Sparkle Dental · receptionist</span>
    <a href="/dashboard" class="{{ 'on' if active == 'overview' }}">Overview</a>
    <a href="/dashboard/calls" class="{{ 'on' if active == 'calls' }}">Calls</a>
    <a href="/dashboard/requests" class="{{ 'on' if active == 'requests' }}">Requests</a>
    <a href="/dashboard/flags" class="{{ 'on' if active == 'flags' }}">Flags</a>
    <a href="/dashboard/evals" class="{{ 'on' if active == 'evals' }}">Evals</a>
    <a href="/chat">Test call ↗</a>
  </div>
</nav>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
