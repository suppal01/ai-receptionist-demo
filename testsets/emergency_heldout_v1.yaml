# Emergency HELD-OUT test set, version 1.
#
# STATUS: APPROVED by the product owner on 2026-10-05. FROZEN: never edited or tuned against;
# replaced by a fresh held-out version when it has been used to guide a fix.
#
# Purpose: an honest recall figure. emergency_v1.yaml is the development set: rules and the
# classifier prompt were adjusted while looking at it, so its score is optimistic. This set is
# written with different wording and situations and is NOT used for tuning: when a case here
# fails, the fix is checked against emergency_v1 and new wording goes into emergency_v2, and
# this set is replaced by a fresh held-out version.
#
# Caveat: written by the same author (Claude Code) as the rules and the classifier prompt, on
# 2026-10-04, before any tuning against it. Cases written by the product owner or a clinician
# would make it more independent; add them as emergency_heldout_v2.
#
# Same format and grading as emergency_v1.yaml.

test_set: emergency_heldout
version: 1
status: approved
approved_by: product owner
approved_on: 2026-10-05

